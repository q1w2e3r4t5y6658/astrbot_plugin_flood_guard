name: astrbot_plugin_flood_guard
display_name: "刷屏守卫 / Flood Guard"
short_desc: "同一条消息重复刷屏自动禁言；群管理员权限校验，播报文案可自定义"
desc: |
  在时间窗口内检测同一条消息的重复次数，达到上限自动禁言。
  阈值、统计窗口、禁言时长与播报文案可在插件配置页设置，
  也可由群主/群管理员在 QQ 群内通过 /flood 命令对单个群单独覆盖。
  命令为英文，说明文档与群内回复为中文。
version: 0.5.2
author: MeowAndy
repo: "https://github.com/q1w2e3r4t5y6658/astrbot_plugin_flood_guard"
astrbot_version: ">=4.0,<5"
support_platforms:
  - aiocqhttp
tags:
  - moderation
  - group
  - mute
  - flood
